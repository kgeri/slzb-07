# AI sandbox config. Copy to .sandbox.conf in the directory you run ./pi-sandbox from.
#
# Read on the host by pi-sandbox; never shell-sourced, and NOT visible inside the sandbox.

# Allowlisted outbound domains, one per line. If this section is missing or empty,
# the built-in default (api.deepseek.com) is used. Use `none` to deny all egress.
[allow_domains]
api.deepseek.com
grafana.ogreg.org
pypi.org
files.pythonhosted.org

# Known package sources - uncomment the ones you need:
# repo.maven.apache.org    # Maven Central
# pypi.org                 # pip
# files.pythonhosted.org   # pip downloads
# registry.npmjs.org       # npm

# Extra host directories to mount read-only, one per line, at the same path
# inside the sandbox. The current working directory is always mounted read-write.
[extra_ro_dirs]
# /data/models
# /srv/datasets
